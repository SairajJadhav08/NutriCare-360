{% extends "base.html" %}

{% block title %}Register - NutriCare-360{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-container">
        <div class="auth-header">
            <div class="auth-logo">
                <i class="fas fa-heartbeat"></i>
            </div>
            <h1 class="auth-title">Create Account</h1>
            <p class="auth-subtitle">Join us to start managing your health</p>
        </div>

        <form method="POST" class="auth-form">
            <div class="form-group">
                <label class="form-label" for="username">
                    <i class="fas fa-user"></i> Username
                </label>
                <input type="text" id="username" name="username" class="form-input" required
                    placeholder="Choose a username (min 3 characters)" minlength="3">
            </div>

            <div class="form-group">
                <label class="form-label" for="password">
                    <i class="fas fa-lock"></i> Password
                </label>
                <input type="password" id="password" name="password" class="form-input" required
                    placeholder="Create a password (min 6 characters)" minlength="6">
            </div>

            <button type="submit" class="btn btn-primary btn-full btn-lg">
                <i class="fas fa-user-plus"></i> Create Account
            </button>
        </form>

        <div class="auth-footer">
            <p>Already have an account?
                <a href="{{ url_for('login') }}">Sign in here</a>
            </p>
            <p style="margin-top: 1rem;">
                <a href="{{ url_for('landing') }}"><i class="fas fa-arrow-left"></i> Back to Home</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
